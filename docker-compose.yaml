name: parameters

services:
  database:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PARAMETERS_ENCRYPTION_KEY: ${PARAMETERS_ENCRYPTION_KEY:?set PARAMETERS_ENCRYPTION_KEY in .env}
      PARAMETERS_MAX_RUNS: ${PARAMETERS_MAX_RUNS:-4}
    ports:
      - "127.0.0.1:${PARAMETERS_PORT:-8080}:8080"
    volumes:
      - workspace:/workspace

volumes:
  database:
  workspace:
