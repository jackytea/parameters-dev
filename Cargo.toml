[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
homepage = "https://parameters.dev"
publish = false

[workspace.dependencies]
parameters-core = { path = "crates/core" }
parameters-lang = { path = "crates/lang" }
parameters-engine = { path = "crates/engine" }
parameters-store = { path = "crates/store" }
parameters-service = { path = "crates/service" }
parameters-mcp = { path = "crates/mcp" }
dioxus = { version = "0.7.10", features = ["fullstack"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
