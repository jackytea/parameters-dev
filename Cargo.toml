[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
homepage = "https://parameters.dev"
publish = false

[workspace.dependencies]
parameters-api = { path = "crates/api" }
parameters-core = { path = "crates/core" }
parameters-lang = { path = "crates/lang" }
parameters-engine = { path = "crates/engine" }
parameters-store = { path = "crates/store" }
parameters-service = { path = "crates/service" }
parameters-mcp = { path = "crates/mcp" }
dirs = "6.0.0"
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
http = "1.5.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "ring", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
proptest = "1.12.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "0.17.14"
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
time = { version = "0.3.55", features = ["serde-well-known"] }
tracing = "0.1.44"
webbrowser = "1.2.7"
uuid = { version = "1.29.2", default-features = false, features = ["serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = false

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
